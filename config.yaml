# AlphaZero Chess Engine Configuration

# --- Game ---
# Which game the pipeline plays.  "chess" (default) or "connect4".
# The active game drives the network input/output dims, the state
# encoding, the MCTS move API and the self-play outcome logic.
game:
  name: chess

# --- Network Architecture ---
network:
  num_residual_blocks: 8
  num_filters: 128
  num_policy_channels: 128
  num_value_channels: 32
  value_fc_size: 128

# --- MCTS ---
mcts:
  num_simulations: 200       # Per move (tunable: 50-800)
  c_puct: 1.5                # PUCT exploration constant
  dirichlet_alpha: 0.25        # Dirichlet noise alpha
  dirichlet_epsilon: 0.3     # Weight of noise vs root prior
  batch_size: 8               # Batch size for tree-parallel MCTS (1 = sequential, no virtual loss)
  c_virtual_loss: 0.5         # Virtual loss penalty for batch MCTS
  mate_seeding: true          # Give each mating root move one terminal pre-visit before search
  min_fresh_sims: 64          # Minimum new simulations after tree reuse (0 = old max(0, budget-root.N))

# --- Self-Play ---
selfplay:
  # NOTE: self-play always trains from the LATEST network (never the gated
  # best) -- evaluation/gating are monitoring signals only.
  num_workers: 8              # Worker processes (8 physical cores; >cores slows CPU-bound MCTS)
  games_per_worker: 8          # Concurrent games per worker process (1 = one game at a time).
                               # >1 gives each game its own private GPU inference endpoint, so the
                               # worker overlaps one game's MCTS tree-walk with another game's GPU
                               # round-trip (fills idle CPU) with NO visit-flattening penalty. The GUI
                               # still shows only one game per worker, switching when that one ends.
                               # More concurrent games = deeper in-flight supply for the GPU server,
                               # so cross-worker aggregation builds large forward batches.
  max_game_length: 180        # Max half-moves before adjudication
  start_fen: null             # FEN to start every self-play game from (null = standard start)
  start_pieces: null          # Start positions for self-play. Piece set = fresh
                              # random legal board every game (case = color);
                              # "standard" = normal start. Mix + weight entries
                              # e.g. "standard:80,KQk:10,KRk:10". Overrides
                              # start_fen.
  start_colors_random: false   # Flip colour assignment per game for asymmetric
                              # specs (e.g. "KQQk"): either side gets the queens.
  adjudicate_material: false   # When max length hit, judge by material instead of draw
  # Material values for adjudication
  piece_values:
    P: 1
    N: 3
    B: 3
    R: 5
    Q: 9
  temperature_threshold: 20   # Move number to switch from high to low temperature
  temperature_high: 1.0
  temperature_low: 0.1
  # Endgame tuning: applied when <= endgame_piece_gate pieces stay on the
  # board (the "simple endgames" the net struggles to convert).  Uses its own
  # temperature and a deeper sim budget without touching the middlegame.
  endgame_temperature: 0.1
  endgame_piece_gate: 1
  endgame_num_simulations: 200
  adjudicate_graded: false     # use tanh grading instead of flat ±1
  adjudicate_scaling: 9.0     # margin is clamped to ±1 queen before tanh, so
                              # the value saturates at ~0.76 (a lone queen):
                              # queen+ = ~0.76, rook = ~0.51, pawn = ~0.11.
                              # Material guides but never approaches mate (1.0).
  # Exact forced-mate override for endgame conversion.
  # When true, self-play move selection is overridden by a proof search
  # when a forced mate within force_mate_max_plies exists on a board
  # with <= force_mate_gate_pieces pieces.
  force_mate: false
  force_mate_max_plies: 5
  force_mate_gate_pieces: 8
  # Deeper proof search for very sparse positions (<= 4 pieces), where the
  # search tree is small enough to stay cheap.  Converts longer endgames
  # (e.g. KR vs K mate-in-4/5) that the shallow 5-ply limit misses.
  force_mate_deep_plies: 9
  force_mate_deep_gate_pieces: 4

# --- Replay Buffer ---
buffer:
  max_size: 150000            # Max positions in replay buffer

# --- Training ---
training:
  batch_size: 1024
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 1e-4
  num_batches_per_step: 24    # Number of gradient steps per training session
  checkpoint_interval: 2000     # Save checkpoint every N training steps
  training_steps_per_iteration: 10  # Games completed between training sessions
  target_replay_ratio: 8       # trains each new position ~8 times; 0 = fixed num_batches_per_step
  max_batches_per_step: 64     # cap per session so a burst of games can't stall self-play
  # Step-decay LR schedule, in TOTAL self-play games (the "total" number in the
  # [Cycle] line; resume-safe).  lr = learning_rate * lr_gamma ** (milestones passed).
  # Placeholder for a ~300k-game run: 40% = 120000, 80% = 240000.  Edit to your plan.
  lr_milestone_games: [120000, 240000]
  lr_gamma: 0.1

# --- Evaluation ---
evaluation:
  eval_interval: 5000         # Run eval every N self-play games
  gate_games: 50              # Games for network-vs-network gating
  gate_win_threshold: 0.55    # Win rate needed to promote
  ref_opponent_games: 50      # Games vs alpha-beta reference
  elo_k_factor: 32            # Elo K-factor
  # Adaptive alpha-beta reference depth: after a reference eval scoring
  # (wins + 0.5*draws) >= ref_depth_threshold for ref_depth_streak evals in a row,
  # the reference depth goes up by one (starting at alpha_beta.depth), up to
  # ref_depth_max.  Deeper references are much slower and eval pauses self-play.
  ref_depth_adaptive: true
  ref_depth_threshold: 0.55
  ref_depth_streak: 2         # 1 = promote on a single eval (noisy with 50 games)
  ref_depth_max: 4

# --- Alpha-Beta Reference Opponent ---
alpha_beta:
  depth: 1
  # Piece values for evaluation
  piece_values:
    P: 1
    N: 3
    B: 3
    R: 5
    Q: 9
  # Positional bonuses (optional, simple)
  checkmate_score: 10000

# --- Statistics ---
stats:
  db_path: "stats.db"
  log_interval: 1             # Log stats every N self-play games

# --- TensorBoard ---
tensorboard:
  enabled: true               # Enable TensorBoard logging
  log_dir: "runs"             # Directory for event files (relative to output/run_name)
  auto_launch: true           # Auto-start TensorBoard when training starts
  host: "127.0.0.1"
  port: 6006

# --- GUI ---
gui:
  host: "127.0.0.1"
  port: 5000
  refresh_interval: 1.0       # Seconds between live updates

# --- Tournament ---
tournament:
  system: round_robin          # "round_robin" or "swiss"
  games_per_pair: 2            # Games played per pair (colors alternate)
  swiss_rounds: 3              # Number of rounds when system = swiss
  elo_k: 32                    # K-factor for tournament Elo tracking
  initial_elo: 1000            # Starting Elo for every invited model

# --- Inference ---
inference:
  use_gpu: true              # true = centralized GPU inference server, false = CPU per-worker
  use_shared_memory: true    # true = shared-memory IPC (zero-copy), false = queue-based pickle
  state_dtype: "float16"     # dtype for shared-memory buffers: "float16" (halves size AND PCIe upload; server casts to f32 on-device)
  policy_dtype: "float16"    # response policy dtype: GPU casts softmax to f16 before download (halves PCIe D2H); workers gather legal priors only
  max_batch: 2048            # Max samples per GPU forward pass (aggregated across workers)
  max_wait_ms: 3.0            # Max ms to wait before firing a partial batch
  prewarm_batch_sizes: [1, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]  # Batch sizes to pre-warm
  client_concurrency: 2        # Num in-flight batches per worker. >1 pipelines requests (flag pending)
                               # Also lets ONE game's search have several batches in flight (more
                               # virtual-loss flattening). With games_per_worker > 1 the other games
                               # already fill the gaps, so 1 is the "pure" setting; benchmark 1 vs 2.

# --- Main ---
main:
  run_name: "run_v3"         # Name for this run (affects output directories)
  output_dir: "output"